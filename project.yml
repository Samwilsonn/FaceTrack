name: FaceTrackCam
options:
  bundleIdPrefix: com.anmol
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FaceTrackCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FaceTrackCam
      - path: Core
    info:
      path: FaceTrackCam/Info.plist
      properties:
        CFBundleDisplayName: FacePull
        UILaunchScreen: {}
        NSCameraUsageDescription: "Use the camera for OBS streaming, face tracking, and background effects."
        NSLocalNetworkUsageDescription: "Stream to OBS and pair with another FacePull iPhone on your local network."
        NSBonjourServices:
          - _facepull._tcp
          - _facepull-video._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anmol.FaceTrackCam
        CURRENT_PROJECT_VERSION: "5"
        MARKETING_VERSION: "2.2.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FacePullUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: FaceTrackCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FaceTrackCam
schemes:
  FaceTrackCam:
    build:
      targets:
        FaceTrackCam: all
    test:
      targets:
        - FacePullUITests
