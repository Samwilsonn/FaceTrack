name: Build and test FaceTrackCam
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode and verify modern iOS SDK
        run: |
          for version in 26.6 26.5 26.4.1 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_${version}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Test framing and stream protocol
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath derived_data | tee build.log
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath simulator_data | tee simulator-build.log
      - name: Run UI smoke test on an available iPhone simulator
        run: |
          set -o pipefail
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices", {})
            candidates = devices.values.flatten.select { |device|
              device["isAvailable"] == true && device["name"].start_with?("iPhone") && device["udid"]
            }
            puts candidates.first["udid"] if candidates.any?
          ')
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "::error::No available iPhone simulator was found for FacePullUITests."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running FacePullUITests on simulator $SIMULATOR_UDID"
          xcodebuild test -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:FacePullUITests \
            -resultBundlePath ui-test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath simulator_data | tee ui-test.log
      - name: Verify full-screen launch configuration
        run: /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app/Info.plist
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app Payload/
          ditto -c -k --keepParent Payload FaceTrackCam.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FaceTrackCam-unsigned-IPA
          path: FaceTrackCam.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FacePull-Windows-USB
          path: USB/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            simulator-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            ui-test-results.xcresult
            ui-test.log
          if-no-files-found: warn

  windows-usb:
    name: Windows USB bridge test
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test USB bridge handshake and reconnect
        shell: pwsh
        run: python USB/test_bridge.py
      - name: Test USB stream probe
        shell: pwsh
        run: python USB/test_stream_probe.py

